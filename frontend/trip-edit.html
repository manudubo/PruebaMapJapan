<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Edit trip – Interactive travel itinerary">
  <meta name="view-transition" content="same-origin">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">

  <title>Edit trip</title>

  <!-- Critical CSS to prevent FOUC -->
  <style>
    html { background: #f5f5f7; }
    html[data-theme="dark"] { background: #000; }
    body { opacity: 0; transition: opacity 0.15s ease; }
    body.ready { opacity: 1; }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    .color-swatch {
      width: 24px; height: 24px;
      border: 2px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
      padding: 0;
    }
    .color-swatch:hover,
    .color-swatch.selected { border-color: var(--text-primary, #1d1d1f); }
    .color-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .geocoder-widget { display: flex; flex-direction: column; gap: 8px; }
    .geocoder-results button {
      display: block; width: 100%; text-align: left;
      padding: 8px 12px; font-size: 14px; font-family: inherit;
      border: none; border-bottom: 1px solid var(--border-color, rgba(0,0,0,0.1));
      background: var(--bg-secondary, #fff); color: var(--text-primary, #1d1d1f);
      cursor: pointer;
    }
    .geocoder-results button:hover { background: var(--accent-subtle, #e8f0fe); }
    .dest-section { margin-bottom: 16px; }
    .dest-section-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; flex-wrap: wrap; }
    .dest-section-body { padding: 16px; }
    .day-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border-color, rgba(0,0,0,0.06)); flex-wrap: wrap; }
    .activity-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .destinations-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .destinations-title-row h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .muted-msg { color: var(--text-secondary, #515154); }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="container">
    <travel-nav></travel-nav>
    <main id="main-content">
      <div class="dashboard-header">
        <h1 id="trip-name-heading">Loading trip…</h1>
        <div class="dashboard-actions">
          <a href="dashboard.html" class="btn btn-secondary">← My Trips</a>
        </div>
      </div>

      <!-- Metadata section -->
      <section id="metadata-section" class="edit-page-section" hidden>
        <h2>Trip Details</h2>
        <form id="metadata-form">
          <div class="form-group">
            <label for="trip-name">Name</label>
            <input type="text" id="trip-name" name="name" required maxlength="255">
          </div>
          <div class="form-group">
            <label for="trip-description">Description</label>
            <textarea id="trip-description" name="description" rows="3"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="trip-start-date">Start</label>
              <input type="date" id="trip-start-date" name="start_date">
            </div>
            <div class="form-group">
              <label for="trip-end-date">End</label>
              <input type="date" id="trip-end-date" name="end_date">
            </div>
          </div>
          <div class="form-group form-group--checkbox">
            <label class="checkbox-label">
              <input type="checkbox" id="trip-public" name="is_public">
              Make public
            </label>
          </div>
          <p class="error-msg" id="metadata-error" hidden></p>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="metadata-save-btn">Save changes</button>
          </div>
        </form>
      </section>

      <!-- Destinations section (populated by destinations.ts) -->
      <section id="destinations-section" hidden>
        <div class="destinations-title-row">
          <h2>Destinations</h2>
          <button class="btn btn-primary" id="add-dest-btn">Add destination</button>
        </div>
        <div id="destinations-list"></div>
        <p class="error-msg muted-msg" id="destinations-empty">This trip has no destinations yet. Add the first one.</p>
      </section>
    </main>
  </div>

  <!-- Shared confirm-delete overlay (reused by all entity types) -->
  <div class="overlay" id="confirm-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="confirm-title">Delete?</h2>
      <p id="confirm-msg"></p>
      <p class="error-msg" id="confirm-error" hidden></p>
      <div class="form-actions">
        <button class="btn btn-secondary" id="confirm-cancel-btn">Cancel</button>
        <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/trip-edit.ts"></script>
</body>
</html>
