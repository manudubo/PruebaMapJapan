<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Plan your trip: add cities, days and places, and see it on the map as you go.">
  <meta name="view-transition" content="same-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking web font (A11Y-05): was a render-blocking CSS @import -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <title>Edit trip</title>

  <!-- Critical CSS to prevent FOUC -->
  <style>
    html { background: #f5f5f7; }
    html[data-theme="dark"] { background: #000; }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="container te-container">
    <travel-nav></travel-nav>
    <search-bar></search-bar>
    <main id="main-content" class="te">
      <header class="te-bar">
        <a href="dashboard.html" class="te-back">&larr; My trips</a>
        <h1 id="trip-name-heading" class="te-title">Loading trip…</h1>
        <div class="te-bar-right">
          <div id="save-status" class="save-status" role="status" aria-live="polite" data-state="idle">
            <span class="save-dot" aria-hidden="true"></span>
            <span class="save-text">Changes save automatically</span>
          </div>
          <a id="te-view-link" class="btn btn-secondary btn-small" href="dashboard.html" hidden>View trip</a>
        </div>
      </header>

      <div id="te-banners" class="te-banners"></div>

      <div id="te-workspace" hidden>
        <div class="te-tabs" role="tablist" aria-label="Plan or preview">
          <button type="button" role="tab" id="te-tab-plan" class="te-tab" aria-selected="true" aria-controls="te-plan">Plan</button>
          <button type="button" role="tab" id="te-tab-preview" class="te-tab" aria-selected="false" aria-controls="te-preview" tabindex="-1">Map &amp; preview</button>
        </div>

        <div class="te-layout">
          <section id="te-plan" class="te-plan is-active" role="tabpanel" aria-labelledby="te-tab-plan">
            <nav id="te-steps" class="te-steps" aria-label="Steps">
              <ol>
                <li><button type="button" data-step="trip" class="te-step"><span class="te-step-n" aria-hidden="true">1</span> Trip</button></li>
                <li><button type="button" data-step="route" class="te-step"><span class="te-step-n" aria-hidden="true">2</span> Route</button></li>
                <li><button type="button" data-step="share" class="te-step"><span class="te-step-n" aria-hidden="true">3</span> Share</button></li>
              </ol>
            </nav>
            <div id="te-view"></div>
          </section>

          <section id="te-preview" class="te-preview" role="tabpanel" aria-labelledby="te-tab-preview" aria-label="Live preview">
            <div class="te-map-wrap map-container">
              <div id="map" data-city="overview" role="application" aria-label="Map of your trip. Markers update as you edit." aria-describedby="te-map-help"></div>
              <p class="sr-only" id="te-map-help">Everything you add is listed in the plan next to the map. Use the plan to edit places; markers can be dragged to move a pin.</p>
              <p id="te-map-empty" class="te-map-empty" hidden></p>
              <div id="te-pick-banner" class="te-pick-banner" hidden role="status">
                <span>Click or tap the map to drop a pin.</span>
                <button type="button" id="te-pick-cancel" class="btn btn-secondary btn-small">Cancel</button>
              </div>
            </div>
            <div id="te-cards" class="te-cards"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div class="te-snackbar" id="te-snackbar" hidden role="status">
    <span id="te-snackbar-msg"></span>
    <button type="button" id="undo-btn" class="btn btn-small te-snackbar-btn">Undo</button>
  </div>

  <script type="module" src="/src/pages/trip-edit.ts"></script>
</body>
</html>
