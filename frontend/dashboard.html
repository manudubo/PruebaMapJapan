<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="My Trips – Interactive travel itinerary">
  <meta name="view-transition" content="same-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking web font (A11Y-05): was a render-blocking CSS @import -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <title>My Trips</title>

  <!-- Critical CSS to prevent FOUC -->
  <style>
    html { background: #f5f5f7; }
    html[data-theme="dark"] { background: #000; }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    .page-card > .dashboard-header {
      padding: 28px 32px 16px;
    }

    .login-prompt {
      padding: 32px;
      text-align: center;
    }

    .login-prompt p {
      margin: 0 0 16px;
      color: var(--jp-text-secondary, #515154);
    }

    .login-prompt .login-prompt-help {
      margin: 20px 0 0;
      font-size: 14px;
    }

    .login-prompt-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .login-prompt-actions .btn {
      min-height: 44px;
      min-width: 96px;
    }

    /* Sign-up off in this build (build/signupGatePlugin.ts): Sign in is the primary action. */
    .login-prompt-actions:has(> [data-signup][hidden]) #auth-login-prompt-btn {
      background: var(--jp-accent-solid);
      border-color: var(--jp-accent-solid);
      color: var(--jp-white);
    }

    @media (max-width: 768px) {
      .page-card > .dashboard-header,
      .login-prompt {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="container">
    <travel-nav></travel-nav>
    <search-bar></search-bar>

    <main id="main-content">
      <div class="page-card">
        <div class="dashboard-header">
          <h1 id="dashboard-greeting">My Trips</h1>
          <div class="dashboard-actions">
            <button id="new-trip-btn" class="btn btn-primary" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              New Trip
            </button>
          </div>
        </div>

        <!-- Login prompt shown to unauthenticated users (managed by dashboard.ts) -->
        <div id="dashboard-login-prompt" class="login-prompt" hidden>
          <p>Sign in to view and manage your trips, or sign up to start planning.</p>
          <div class="login-prompt-actions">
            <button id="auth-signup-prompt-btn" class="btn btn-primary" type="button" data-signup>Sign up</button>
            <button id="auth-login-prompt-btn" class="btn btn-secondary" type="button">Sign in</button>
          </div>
          <p class="login-prompt-help" data-signup><a id="auth-recover-link" href="recover.html">Can't use your passkey? Recover your account</a></p>
        </div>

        <div class="trips-grid" id="trips-grid" hidden aria-live="polite">
          <!-- Trip cards rendered by dashboard.ts -->
        </div>
      </div>
    </main>
  </div>

  <!-- Create-trip overlay -->
  <div class="overlay" id="create-trip-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="create-trip-title">
    <div class="modal">
      <h2 id="create-trip-title">Create New Trip</h2>
      <form id="create-trip-form" novalidate>
        <div class="form-group">
          <label for="trip-name">Trip name *</label>
          <input type="text" id="trip-name" name="name" required placeholder="e.g. Japan 2027" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="trip-description">Description</label>
          <textarea id="trip-description" name="description" rows="2" placeholder="Optional description"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="trip-start">Start date</label>
            <input type="date" id="trip-start" name="start_date">
          </div>
          <div class="form-group">
            <label for="trip-end">End date</label>
            <input type="date" id="trip-end" name="end_date">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="create-trip-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Create trip</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/pages/dashboard.ts"></script>
</body>
</html>
