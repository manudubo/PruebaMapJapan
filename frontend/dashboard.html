<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="My Trips – Interactive travel itinerary">
  <meta name="view-transition" content="same-origin">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">

  <title>My Trips</title>

  <!-- Critical CSS to prevent FOUC -->
  <style>
    html { background: #f5f5f7; }
    html[data-theme="dark"] { background: #000; }
    body { opacity: 0; transition: opacity 0.15s ease; }
    body.ready { opacity: 1; }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    .trips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 16px 32px 32px;
    }

    .page-card > .dashboard-header {
      padding: 28px 32px 16px;
    }

    .trip-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-secondary, #fff);
      border: 1px solid var(--border-color, rgba(0,0,0,0.1));
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease;
    }

    .trip-card:hover {
      border-color: var(--accent, #0071e3);
    }

    .trip-card-cover {
      position: relative;
      height: 140px;
      background: var(--accent-subtle, rgba(0,113,227,0.08));
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 8px;
    }

    .trip-card-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      background: rgba(0,0,0,0.45);
      color: #fff;
    }

    .trip-card-badge--public {
      background: rgba(52, 199, 89, 0.8);
    }

    .trip-card-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trip-card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary, #1d1d1f);
      line-height: 1.3;
    }

    .trip-card-desc {
      margin: 0;
      font-size: 13px;
      color: var(--text-secondary, #515154);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .trip-card-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 8px;
    }

    .trip-card-dates,
    .trip-card-dests {
      font-size: 12px;
      color: var(--text-tertiary, #86868b);
    }

    .trip-card-actions {
      padding: 8px 16px 12px;
      border-top: 1px solid var(--border-color, rgba(0,0,0,0.08));
    }

    /* Empty / error states */
    .trips-empty,
    .trips-error {
      grid-column: 1 / -1;
      padding: 32px;
      text-align: center;
      color: var(--text-secondary, #515154);
      font-size: 15px;
    }

    .login-prompt {
      padding: 32px;
      text-align: center;
    }

    .login-prompt p {
      margin: 0 0 16px;
      color: var(--text-secondary, #515154);
    }

    @media (max-width: 768px) {
      .page-card > .dashboard-header,
      .trips-grid,
      .login-prompt {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="container">
    <travel-nav></travel-nav>
    <search-bar></search-bar>

    <main id="main-content">
      <div class="page-card">
        <div class="dashboard-header">
          <h1 id="dashboard-greeting">My Trips</h1>
          <div class="dashboard-actions">
            <button id="new-trip-btn" class="btn btn-primary" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              New Trip
            </button>
          </div>
        </div>

        <!-- Login prompt shown to unauthenticated users (managed by dashboard.ts) -->
        <div id="dashboard-login-prompt" class="login-prompt" hidden>
          <p>Sign in to view and manage your trips.</p>
          <button id="auth-login-prompt-btn" class="btn btn-primary" type="button">Sign in</button>
        </div>

        <div class="trips-grid" id="trips-grid" hidden>
          <!-- Trip cards rendered by dashboard.ts -->
        </div>
      </div>
    </main>
  </div>

  <!-- Create-trip overlay -->
  <div class="overlay" id="create-trip-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="create-trip-title">
    <div class="modal">
      <h2 id="create-trip-title">Create New Trip</h2>
      <form id="create-trip-form" novalidate>
        <div class="form-group">
          <label for="trip-name">Trip name *</label>
          <input type="text" id="trip-name" name="name" required placeholder="e.g. Japan 2027" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="trip-description">Description</label>
          <textarea id="trip-description" name="description" rows="2" placeholder="Optional description"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="trip-start">Start date</label>
            <input type="date" id="trip-start" name="start_date">
          </div>
          <div class="form-group">
            <label for="trip-end">End date</label>
            <input type="date" id="trip-end" name="end_date">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="create-trip-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Create trip</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/pages/dashboard.ts"></script>
  <script>
    document.fonts.ready.then(function() { document.body.classList.add('ready'); });
    window.addEventListener('load', function() { document.body.classList.add('ready'); });
  </script>
</body>
</html>
