<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="My Profile – Travel Planner">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">

  <title>My Profile</title>

  <style>
    html { background: #f5f5f7; }
    html[data-theme="dark"] { background: #000; }
    body { opacity: 0; transition: opacity 0.15s ease; }
    body.ready { opacity: 1; }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    .profile-header {
      padding: 28px 0 20px;
      border-bottom: 1px solid var(--border-color, rgba(0,0,0,0.1));
      margin-bottom: 28px;
    }

    .profile-header h1 {
      margin: 0 0 4px;
      font-size: clamp(20px, 4vw, 26px);
      font-weight: 700;
      color: var(--text-primary, #1d1d1f);
    }

    .profile-header p {
      margin: 0;
      font-size: 14px;
      color: var(--text-secondary, #515154);
    }

    .profile-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color, rgba(0,0,0,0.06));
    }

    .profile-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .profile-row:first-of-type {
      padding-top: 0;
    }

    .profile-row-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary, #1d1d1f);
    }

    .profile-row-value {
      font-size: 14px;
      color: var(--text-secondary, #515154);
    }

    .passkey-list {
      list-style: none;
      margin: 0 0 16px;
      padding: 0;
    }

    .passkey-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color, rgba(0,0,0,0.06));
    }

    .passkey-item:last-child { border-bottom: none; }

    .passkey-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .passkey-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary, #1d1d1f);
    }

    .passkey-meta {
      font-size: 12px;
      color: var(--text-tertiary, #86868b);
    }

    .loading-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary, #515154);
      font-size: 14px;
      padding: 12px 0;
    }

    .passkey-empty {
      padding: 8px 0;
      color: var(--text-secondary, #515154);
      font-size: 14px;
    }

    .profile-note,
    .profile-row-note {
      color: var(--text-secondary, #515154);
    }

    .profile-note {
      margin: 0 0 16px;
      font-size: 14px;
    }

    .profile-row-note {
      margin: 4px 0 0;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .profile-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="container">
    <travel-nav></travel-nav>
    <search-bar></search-bar>

    <main id="main-content">
      <div class="page-card">
        <div class="profile-header">
          <h1 id="profile-name">My Profile</h1>
          <p id="profile-email"></p>
        </div>

        <!-- Account info -->
        <section class="profile-section" aria-labelledby="section-info-title">
          <h2 class="profile-section-title" id="section-info-title">Account Information</h2>
          <div class="profile-row">
            <span class="profile-row-label">Name</span>
            <span class="profile-row-value" id="info-name">—</span>
          </div>
          <div class="profile-row">
            <span class="profile-row-label">Email</span>
            <span class="profile-row-value" id="info-email">—</span>
          </div>
          <div class="profile-row">
            <span class="profile-row-label">Username</span>
            <span class="profile-row-value" id="info-username">—</span>
          </div>
          <div class="profile-row">
            <span class="profile-row-label">Password</span>
            <button id="btn-change-password" class="btn btn-secondary" type="button">
              Change password
            </button>
          </div>
        </section>

        <!-- Passkeys -->
        <section class="profile-section" aria-labelledby="section-passkeys-title">
          <h2 class="profile-section-title" id="section-passkeys-title">Passkeys</h2>
          <p class="profile-note">
            Passkeys let you sign in without a password using your fingerprint, Face ID, or security key.
          </p>
          <ul class="passkey-list" id="passkey-list">
            <li class="loading-row">
              <div class="loading-bar" aria-hidden="true"></div>
              Loading passkeys…
            </li>
          </ul>
          <button id="btn-add-passkey" class="btn btn-primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add passkey
          </button>
          <div id="passkey-status" class="status-msg" hidden></div>
        </section>

        <!-- Danger zone -->
        <section class="profile-section" aria-labelledby="section-danger-title">
          <h2 class="profile-section-title" id="section-danger-title">Session</h2>
          <div class="profile-row">
            <div>
              <span class="profile-row-label">Sign out</span>
              <p class="profile-row-note">Signs you out on this device.</p>
            </div>
            <button id="btn-logout" class="btn btn-danger" type="button">Sign out</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/src/pages/profile.ts"></script>
  <script>
    document.fonts.ready.then(function() { document.body.classList.add('ready'); });
    window.addEventListener('load', function() { document.body.classList.add('ready'); });
  </script>
</body>
</html>
