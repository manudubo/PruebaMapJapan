<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Travel Planner — Planificá tu próximo viaje con mapas interactivos, días y actividades.">
  <meta name="view-transition" content="same-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">

  <title>Travel Planner</title>

  <!-- Critical CSS to prevent FOUC -->
  <style>
    html { background: #f5f5f7; }
    html[data-theme="dark"] { background: #000; }
    body { opacity: 0; transition: opacity 0.15s ease; }
    body.ready { opacity: 1; }
  </style>
  <script>
    // Apply theme immediately to prevent flash
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    /* Landing page hero */
    .landing-hero {
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      gap: 0;
    }

    .landing-eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent, #0071e3);
      margin-bottom: 16px;
    }

    .landing-title {
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 700;
      color: var(--text-primary, #1d1d1f);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0 0 20px;
    }

    .landing-tagline {
      font-size: clamp(15px, 2.5vw, 18px);
      color: var(--text-secondary, #515154);
      max-width: 520px;
      line-height: 1.6;
      margin: 0 0 40px;
    }

    .landing-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .landing-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      border: 1px solid transparent;
      line-height: 1;
    }

    .landing-btn--primary {
      background: var(--accent, #0071e3);
      color: #fff;
      border-color: var(--accent, #0071e3);
    }

    .landing-btn--primary:hover {
      background: var(--accent-hover, #0077ed);
      border-color: var(--accent-hover, #0077ed);
    }

    .landing-btn--secondary {
      background: transparent;
      color: var(--text-primary, #1d1d1f);
      border-color: var(--border-strong, rgba(0,0,0,0.1));
    }

    .landing-btn--secondary:hover {
      border-color: var(--text-secondary, #515154);
    }

    /* Loading state */
    .landing-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 56px);
      gap: 12px;
      color: var(--text-secondary, #515154);
      font-size: 14px;
    }

    .landing-loading.is-visible {
      display: flex;
    }

    .landing-hero.is-hidden {
      display: none;
    }

    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-strong, rgba(0,0,0,0.1));
      border-top-color: var(--accent, #0071e3);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <div class="container">
    <travel-nav></travel-nav>
    <search-bar></search-bar>

    <main id="main-content">
      <!-- Loading state while auth check runs -->
      <div class="landing-loading" id="landing-loading" aria-live="polite">
        <div class="loading-spinner" aria-hidden="true"></div>
        <span>Cargando...</span>
      </div>

      <!-- Hero — shown to unauthenticated users -->
      <section class="landing-hero" id="landing-hero" aria-label="Bienvenida">
        <p class="landing-eyebrow">Travel Planner</p>
        <h1 class="landing-title">Tu próximo viaje,<br>perfectamente planificado.</h1>
        <p class="landing-tagline">Planificá tu próximo viaje. Días, destinos y actividades, todo en un mapa interactivo.</p>
        <div class="landing-actions">
          <button id="landing-login-btn" class="landing-btn landing-btn--primary" type="button">
            Iniciar sesión
          </button>
          <a href="tokyo.html" class="landing-btn landing-btn--secondary">
            Ver demo
          </a>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script type="module">
    import { initKeycloak, isAuthenticated, login } from '/src/auth/keycloak.ts';

    const hero = document.getElementById('landing-hero');
    const loading = document.getElementById('landing-loading');

    // Show loading while auth check runs
    if (loading) loading.classList.add('is-visible');
    if (hero) hero.classList.add('is-hidden');

    try {
      await initKeycloak();
    } catch {
      // Keycloak not available — show landing to everyone
    }

    if (isAuthenticated()) {
      // Authenticated: redirect to dashboard
      window.location.replace('dashboard.html');
    } else {
      // Unauthenticated: reveal the landing hero
      if (loading) loading.classList.remove('is-visible');
      if (hero) hero.classList.remove('is-hidden');

      const loginBtn = document.getElementById('landing-login-btn');
      if (loginBtn) {
        loginBtn.addEventListener('click', () => login(window.location.origin + '/dashboard.html'));
      }
    }
  </script>
  <script>
    // Mark body as ready when styles are loaded
    document.fonts.ready.then(function() {
      document.body.classList.add('ready');
    });
    // Fallback for browsers without font loading API
    window.addEventListener('load', function() {
      document.body.classList.add('ready');
    });
  </script>
</body>
</html>
