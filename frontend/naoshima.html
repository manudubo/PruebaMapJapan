<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Naoshima itinerary - Mar 18 to Mar 19, 2026">
  <meta name="view-transition" content="same-origin">
  <link rel="manifest" href="manifest.json">
  <title>Naoshima – Japan 2026</title>
  <!-- Critical CSS to prevent FOUC -->
  <style>
    html { background: #f5f5f7; }
    html[data-theme="dark"] { background: #000; }
    body { opacity: 0; transition: opacity 0.15s ease; }
    body.ready { opacity: 1; }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="container">
    <travel-nav></travel-nav>
    <search-bar></search-bar>
    <main id="main-content">
      <div class="page-card">
        <header class="header">
          <h1>Naoshima</h1>
          <p>Mar 18 – 19, 2026 · 2 days</p>
        </header>
        <div class="day-selector" id="day-selector"></div>
        <div class="map-container">
          <div id="map" data-city="naoshima"></div>
          <button class="hotel-btn" id="hotel-btn" title="Go to hotel">H</button>
        </div>
        <div class="legend">
          <h3>Activities</h3>
          <div class="legend-grid" id="legend-grid"></div>
          <div class="hotel-info" id="hotel-info"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/src/main.ts"></script>
  <script>
    document.fonts.ready.then(function() { document.body.classList.add('ready'); });
    window.addEventListener('load', function() { document.body.classList.add('ready'); });
  </script>
</body>
</html>
