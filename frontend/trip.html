<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Trip detail – interactive itinerary">
  <meta name="view-transition" content="same-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking web font (A11Y-05): was a render-blocking CSS @import -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/197/197604.png">

  <title>Trip – Itinerary</title>

  <!-- Critical CSS to prevent FOUC -->
  <style>
    html { background: #f5f5f7; }
    html[data-theme="dark"] { background: #000; }
    body { opacity: 0; transition: opacity 0.15s ease; }
    body.ready { opacity: 1; }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>


  <style>
    /* Destination tabs */
    .dest-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 8px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--jp-text-tertiary, #86868b) transparent;
    }

    .dest-tabs::-webkit-scrollbar {
      height: 6px;
    }

    .dest-tabs::-webkit-scrollbar-thumb {
      background: var(--jp-text-tertiary, #86868b);
    }

    .dest-tab {
      padding: 8px 14px;
      border-radius: 0;
      border: 1px solid var(--jp-border-strong);
      background: var(--jp-surface);
      color: var(--jp-text-secondary, #515154);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .dest-tab:hover {
      color: var(--jp-text, #1d1d1f);
      border-color: var(--jp-text-secondary, #515154);
    }

    .dest-tab.is-active {
      background: var(--jp-accent-solid);
      color: var(--jp-white);
      border-color: var(--jp-accent-solid);
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="container">
    <travel-nav></travel-nav>
    <search-bar></search-bar>

    <main id="main-content">
      <div class="page-card">
        <header class="header">
          <h1 id="trip-title">Loading trip…</h1>
          <p id="trip-subtitle"></p>
          <button id="copy-link-btn" class="btn btn-secondary" hidden>Copy public link</button>
          <a id="trip-edit-link" href="#" class="btn btn-secondary" data-owner-only hidden>Edit trip</a>
        </header>

        <!-- Destination tabs (rendered by tripDetail.ts) -->
        <div class="dest-tabs" id="dest-tabs" role="tablist" aria-label="Destination tabs"></div>

        <!-- Day selector (populated by tripDetail.ts via initMap) -->
        <div class="day-selector" id="day-selector" role="tablist" aria-label="Day selector"></div>

        <!-- Map -->
        <div class="map-container">
          <div id="map" role="application" aria-label="Map"></div>
          <button class="hotel-btn" id="hotel-btn" title="Go to hotel" aria-label="Center map on hotel">H</button>
        </div>

        <!-- Legend -->
        <div class="legend" aria-label="Legend">
          <h2>Activities</h2>
          <div class="legend-grid" id="legend-grid" role="list"></div>
          <div class="hotel-info" id="hotel-info"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/pages/tripDetail.ts"></script>
  <script>
    document.fonts.ready.then(function() { document.body.classList.add('ready'); });
    window.addEventListener('load', function() { document.body.classList.add('ready'); });
  </script>
</body>
</html>
