<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Tokyo final itinerary - Mar 22 to Mar 23, 2026">
  <meta name="view-transition" content="same-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking web font (A11Y-05): was a render-blocking CSS @import -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>

  <link rel="manifest" href="manifest.json">
  <title>Tokyo (Final) – Japan 2026</title>
  <!-- Critical CSS to prevent FOUC -->
  <style>
    html { background: #f5f5f7; }
    html[data-theme="dark"] { background: #000; }
    body { opacity: 0; transition: opacity 0.15s ease; }
    body.ready { opacity: 1; }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="container">
    <travel-nav></travel-nav>
    <search-bar></search-bar>
    <main id="main-content">
      <div class="page-card">
        <header class="header">
          <h1>Tokyo (Final)</h1>
          <p>Mar 22 – 23, 2026 · 2 days</p>
        </header>
        <div class="day-selector" id="day-selector"></div>
        <div class="map-container">
          <div id="map" data-city="tokyo2"></div>
          <button class="hotel-btn" id="hotel-btn" title="Go to hotel">H</button>
        </div>
        <div class="legend">
          <h2>Activities</h2>
          <div class="legend-grid" id="legend-grid"></div>
          <div class="hotel-info" id="hotel-info"></div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    document.fonts.ready.then(function() { document.body.classList.add('ready'); });
    window.addEventListener('load', function() { document.body.classList.add('ready'); });
  </script>
</body>
</html>
