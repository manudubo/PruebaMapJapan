<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="view-transition" content="same-origin">
  <link rel="manifest" href="manifest.json">
  <title>Naoshima – Japón 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <travel-nav></travel-nav>
    <div class="page-card">
      <header class="header"><h1>Naoshima</h1><p>18 – 19 Marzo 2026 · 2 días</p></header>
      <div class="day-selector" id="day-selector"></div>
      <div class="map-container"><div id="map" data-city="naoshima"></div><button class="hotel-btn" id="hotel-btn" title="Ir al hotel">H</button></div>
      <div class="legend">
        <h3>Actividades</h3>
        <div class="legend-grid" id="legend-grid"></div>
        <div class="hotel-info" id="hotel-info"></div>
        <div class="info-box"><h4>Notas</h4><p>Isla del arte contemporáneo<br>Chichu Art Museum, Benesse House<br>Esculturas al aire libre</p></div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
