# Japan Trip login theme. It extends the abstract `base` theme (templates and behaviour,
# no styling) instead of `keycloak`, so no PatternFly/Bootstrap markup or CSS is loaded:
# every class below is defined in resources/css/login.css, which carries the same design
# tokens as frontend/src/styles/main.css.
parent=base
import=common/keycloak

styles=css/login.css
scripts=js/jp-login.js
meta=viewport==width=device-width,initial-scale=1

# No appUrl default on purpose: the way back to the app is the client's Base URL (footer.ftl).
locales=es,en
defaultLocale=es

kcHtmlClass=jp-html
kcBodyClass=jp-body
kcLoginClass=jp-page
kcHeaderClass=jp-brand
kcHeaderWrapperClass=jp-brand__name
kcFormCardClass=jp-card
kcFormHeaderClass=jp-card__header
kcContentWrapperClass=jp-required-note
kcLabelWrapperClass=jp-label-row

# Locale switcher (only rendered when the realm enables internationalization)
kcLocaleMainClass=jp-locale
kcLocaleWrapperClass=
kcLocaleDropDownClass=jp-locale__menu-button
kcLocaleListClass=jp-locale__list
kcLocaleListItemClass=
kcLocaleItemClass=jp-locale__link

# Alerts
kcAlertClass=jp-alert
kcAlertTitleClass=jp-alert__text kc-feedback-text
kcFeedbackErrorIcon=jp-icon jp-icon--alert
kcFeedbackWarningIcon=jp-icon jp-icon--warning
kcFeedbackSuccessIcon=jp-icon jp-icon--check
kcFeedbackInfoIcon=jp-icon jp-icon--info

# Forms
kcFormClass=jp-form
kcFormGroupClass=jp-field
kcInputClass=jp-input
kcLabelClass=jp-label
kcInputWrapperClass=
kcInputGroup=jp-input-group
kcInputErrorMessageClass=jp-field__error kc-feedback-text
kcInputHelperTextBeforeClass=jp-field__hint
kcInputHelperTextAfterClass=jp-field__hint
kcTextareaClass=jp-input
kcFormSettingClass=
kcFormOptionsClass=jp-form__options
kcFormOptionsWrapperClass=
kcFormButtonsClass=jp-form__buttons
kcFormButtonsWrapperClass=jp-form__buttons
kcInputClassCheckbox=
kcInputClassCheckboxInput=jp-check__input
kcInputClassCheckboxLabel=jp-check__label
kcInputClassRadio=
kcInputClassRadioInput=jp-check__input
kcInputClassRadioLabel=jp-check__label
kcInputClassRadioCheckboxLabelDisabled=
kcCheckClass=
kcCheckInputClass=jp-check__input
kcCheckLabelClass=jp-check__label
kcFormGroupHeader=jp-field

# Buttons
kcButtonClass=jp-btn
kcButtonPrimaryClass=jp-btn--primary
kcButtonDefaultClass=jp-btn--secondary
kcButtonSecondaryClass=jp-btn--secondary
kcButtonBlockClass=jp-btn--block
kcButtonLargeClass=
kcMarginTopClass=jp-mt
kcFormPasswordVisibilityButtonClass=jp-input-group__toggle
kcFormPasswordVisibilityIconShow=jp-icon jp-icon--eye
kcFormPasswordVisibilityIconHide=jp-icon jp-icon--eye-off

# Sign-up / info area under the form
kcSignUpClass=
kcInfoAreaWrapperClass=

# Authenticator chooser ("Try another way") and registered-passkey list
kcSelectAuthListClass=jp-choices
kcSelectAuthListItemClass=jp-choice
kcSelectAuthListItemIconClass=jp-choice__icon
kcSelectAuthListItemIconPropertyClass=
kcSelectAuthListItemBodyClass=jp-choice__body
kcSelectAuthListItemHeadingClass=jp-choice__title
kcSelectAuthListItemDescriptionClass=jp-choice__desc
kcSelectAuthListItemFillClass=jp-choice__fill
kcSelectAuthListItemArrowClass=jp-choice__arrow
kcSelectAuthListItemArrowIconClass=jp-icon jp-icon--chevron
kcSelectAuthListItemTitle=jp-choices__title
kcAuthenticatorDefaultClass=jp-icon jp-icon--list
kcAuthenticatorPasswordClass=jp-icon jp-icon--lock
kcAuthenticatorOTPClass=jp-icon jp-icon--phone
kcAuthenticatorRecoveryAuthnCodesClass=jp-icon jp-icon--list
kcAuthenticatorWebAuthnClass=jp-icon jp-icon--key
kcAuthenticatorWebAuthnPasswordlessClass=jp-icon jp-icon--key

# WebAuthn transports and the page icon
kcWebAuthnKeyIcon=jp-icon jp-icon--key
kcWebAuthnDefaultIcon=jp-icon jp-icon--key
kcWebAuthnUnknownIcon=jp-icon jp-icon--key
kcWebAuthnUSB=jp-icon jp-icon--key
kcWebAuthnNFC=jp-icon jp-icon--key
kcWebAuthnBLE=jp-icon jp-icon--key
kcWebAuthnInternal=jp-icon jp-icon--key

# One-time-code credential picker (login-otp.ftl)
kcLoginOTPListClass=jp-choice
kcLoginOTPListInputClass=jp-choice__input
kcLoginOTPListItemHeaderClass=jp-choice__body
kcLoginOTPListItemIconBodyClass=jp-choice__icon
kcLoginOTPListItemIconClass=jp-icon jp-icon--phone
kcLoginOTPListItemTitleClass=jp-choice__title

# Recovery codes
kcRecoveryCodesWarning=jp-alert jp-alert--warning
kcRecoveryCodesList=jp-codes
kcRecoveryCodesActions=jp-form__buttons
kcRecoveryCodesConfirmation=

# Identity providers (none configured today; kept so adding one needs no template change)
kcFormSocialAccountSectionClass=jp-social
kcFormSocialAccountListClass=jp-social__list
kcFormSocialAccountListGridClass=
kcFormSocialAccountListButtonClass=jp-btn jp-btn--secondary jp-btn--block
kcFormSocialAccountListButtonDisabledClass=jp-btn--disabled
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=
kcCommonLogoIdP=
