#encoding=UTF-8
# One generic message for every credential failure: a wrong password, an unknown
# user at the password step and a brute-force-locked account must read the same,
# otherwise the page tells an attacker that the lockout worked (PROD-HARDENING.md).
invalidUserMessage=Invalid username or password.
invalidPasswordMessage=Invalid username or password.
accountTemporarilyDisabledMessage=Invalid username or password.
accountPermanentlyDisabledMessage=Invalid username or password.

# Copy used by the theme's own pages (template.ftl, login-username.ftl, login-password.ftl, ...)
jpSignInTitle=Sign in
jpSignInSubtitle=Enter your email to continue with a passkey or a password.
jpPasswordTitle=Enter your password
jpNotYou=Not you?
jpBackToApp=Back to {0}

# Short, sentence-case labels instead of Keycloak's title-case defaults
doLogIn=Sign in
doRegister=Create account
doTryAnotherWay=Try another way
doForgotPassword=Forgot your password?
noAccount=New here?
backToLogin=Back to sign in
backToApplication=Back to the app
registerTitle=Create your account
emailForgotTitle=Reset your password
errorTitle=Something went wrong
jpSendResetLink=Send reset link
cookieNotFoundMessage=Your sign-in session expired, or cookies are disabled in your browser. Enable cookies if needed, then go back to the app and sign in again.

# Passkeys. The label of a new passkey is generated from the device (js/passkey-label.js),
# so "on" and the fallback name are translated here and nothing is asked from the user.
webauthn-registration-title=Create a passkey
doRegisterSecurityKey=Register passkey
jpPasskeyRegisterSubtitle=Sign in with your fingerprint, face or screen lock. No password to remember.
jpPasskeyLabelOn=on
jpPasskeyLabelFallback=Passkey
# REG-07: footer.ftl, passkey steps -> the app's e-mail recovery page
jpPasskeyRecovery=Can''t use a passkey on this device? Get a code by email

# Passkey-first sign-in (passkeys.ftl, js/passkey-first.js): a browser that has used a passkey
# here gets the passkey prompt before any username is typed
jpPasskeyLead=Sign in with the passkey saved on this device.
jpPasskeyWaiting=Confirm with your passkey on this device.
jpPasskeySigningIn=Signing you in...
jpPasskeyDismissed=Passkey sign-in was cancelled. Try again, or continue with your email.
jpPasskeyFailed=We could not use your passkey. Try again, or continue with your email.
jpPasskeyUnsupported=This device cannot use a passkey here. Continue with your email.
jpPasskeyContinue=Continue with passkey
jpPasskeyOther=Use another account
jpPasskeyButton=Sign in with a passkey
