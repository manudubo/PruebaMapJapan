name = "prueba-map-japan-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Deployed Workers are production: no localhost CORS origins, and OTP email
# requires RESEND_API_KEY (SEC-08/SEC-23). Local `wrangler dev` overrides this
# via ENVIRONMENT=development in .dev.vars.
ENVIRONMENT = "production"
# Explicit DB driver (ARCH-02): Neon serverless over HTTP on Workers.
DB_DRIVER = "neon"

# Neon database connection string is provided via secret:
# wrangler secret put DATABASE_URL
