# TravelMap production stack for a home server. See docs/SELF-HOSTING.md.
#
# Do not run `docker compose` on this file directly: use the scripts in
# ./scripts (deploy.sh, status.sh, ...) or ./scripts/compose.sh, which read
# .env, derive the URLs for your HOST_MODE and select the right profiles.
#
# Nothing is published on 0.0.0.0 except by the `public-proxy` profile
# (INGRESS=caddy). Postgres, the backend and Keycloak are only reachable on
# the internal compose networks; the proxy and the Keycloak admin port are
# bound to 127.0.0.1.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

x-proxy: &proxy
  <<: *hardening
  image: ${CADDY_IMAGE:-public.ecr.aws/docker/library/caddy:2.10-alpine}
  command: ["caddy", "run", "--config", "/etc/caddy/${CADDY_CONFIG:?run via scripts/compose.sh}.Caddyfile", "--adapter", "caddyfile"]
  environment:
    PUBLIC_HOST: ${PUBLIC_HOST:-}
    DOMAIN: ${DOMAIN:-}
    ACME_EMAIL: ${ACME_EMAIL:-}
  volumes:
    - ./caddy:/etc/caddy:ro
    - caddy_data:/data
    - caddy_config:/config
  depends_on:
    - backend
    - keycloak
  networks:
    edge:
      aliases: [proxy]
  mem_limit: 128m
  cpus: 0.5
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  read_only: true
  healthcheck:
    # Port check only: which Host header answers 200 depends on the mode.
    test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  postgres:
    <<: *hardening
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-travelmap}-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=60
      - -c
      - work_mem=4MB
      - -c
      - log_min_duration_statement=2000
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [db]
    shm_size: 128m
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/selfhost/backend/Dockerfile
      target: runtime
    image: ${COMPOSE_PROJECT_NAME:-travelmap}-backend:local
    container_name: ${COMPOSE_PROJECT_NAME:-travelmap}-backend
    init: true
    environment:
      ENVIRONMENT: production
      DB_DRIVER: pg
      DATABASE_URL: postgresql://travelmap:${APP_DB_PASSWORD}@postgres:5432/travelmap
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      KEYCLOAK_URL: ${KC_PUBLIC_URL:?run via scripts/compose.sh}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-japan-trip}
      # Fetch signing keys inside the compose network, not through the tunnel.
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:-japan-trip}/protocol/openid-connect/certs
      # Empty = derived: issuer ${KC_PUBLIC_URL}/realms/<realm>, azp = VALID_AUDIENCES.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      ALLOWED_AZP: ${ALLOWED_AZP:-}
      VALID_AUDIENCES: japan-trip-frontend
      OTP_SECRET: ${OTP_SECRET:?set in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?run via scripts/compose.sh}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Self-registration: verified-email gate and Admin-API password reset used
      # by account recovery (docs/SELF-HOSTING.md). Empty secret = recovery off.
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://keycloak:8080/auth}
      KEYCLOAK_RECOVERY_CLIENT_ID: ${KEYCLOAK_RECOVERY_CLIENT_ID:-travelmap-recovery}
      KEYCLOAK_RECOVERY_CLIENT_SECRET: ${KEYCLOAK_RECOVERY_CLIENT_SECRET:-}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-}
      NOMINATIM_CONTACT: ${NOMINATIM_CONTACT:-}
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
      CLIENT_IP_HEADER: x-forwarded-for
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db, edge]
    mem_limit: 256m
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]

  # One-off: `scripts/compose.sh run --rm migrate npm run db:migrate`
  migrate:
    build:
      context: ../..
      dockerfile: deploy/selfhost/backend/Dockerfile
      target: tools
    image: ${COMPOSE_PROJECT_NAME:-travelmap}-backend-tools:local
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://travelmap:${APP_DB_PASSWORD}@postgres:5432/travelmap
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db]
    logging: *logging
    security_opt:
      - no-new-privileges:true

  keycloak:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/selfhost/keycloak/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-travelmap}-keycloak:local
    container_name: ${COMPOSE_PROJECT_NAME:-travelmap}-keycloak
    command: ["start", "--optimized"]
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
      KC_DB_POOL_MAX_SIZE: "20"
      # Check pooled connections before use, so the first requests after a
      # Postgres restart do not fail on dead connections (500 otherwise).
      QUARKUS_DATASOURCE_JDBC_VALIDATE_ON_BORROW: "true"
      # Public URL (issuer, login pages, emails), path included.
      KC_HOSTNAME: ${KC_PUBLIC_URL:?run via scripts/compose.sh}
      # Admin console only via SSH tunnel to the 127.0.0.1 port below.
      KC_HOSTNAME_ADMIN: http://localhost:${KC_ADMIN_PORT:-28081}/auth
      # TLS ends at the proxy; trust its X-Forwarded-* (only the proxy and
      # 127.0.0.1 can reach this container).
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set in .env}
      KC_LOG_CONSOLE_OUTPUT: json
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:${KC_ADMIN_PORT:-28081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db, edge]
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # INGRESS=funnel / cloudflared: plain HTTP on 127.0.0.1 only.
  proxy:
    <<: *proxy
    container_name: ${COMPOSE_PROJECT_NAME:-travelmap}-proxy
    profiles: [local-proxy]
    ports:
      - "127.0.0.1:${PROXY_PORT:-28080}:80"

  # INGRESS=caddy: public 80/443 with automatic Let's Encrypt certificates.
  proxy-public:
    <<: *proxy
    container_name: ${COMPOSE_PROJECT_NAME:-travelmap}-proxy-public
    profiles: [public-proxy]
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"

  # INGRESS=cloudflared: outbound-only tunnel, no open ports.
  cloudflared:
    <<: *hardening
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2025.9.1}
    container_name: ${COMPOSE_PROJECT_NAME:-travelmap}-cloudflared
    profiles: [cloudflared]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - proxy
    networks: [edge]
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]

networks:
  # Postgres lives here only: no route to the internet, nothing published.
  db:
    internal: true
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
