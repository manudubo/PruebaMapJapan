<!DOCTYPE html><html class="jp-html" lang="en"><head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

            <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sign in to Japan Trip</title>
    <link rel="icon" href="/resources/login/japan-trip/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
            <link href="/resources/login/japan-trip/css/login.css" rel="stylesheet">
            
    
    
    
    
        
</head>

<body class="jp-body" data-page-id="login-login-username">
<div class="jp-page">
    <div id="kc-header" class="jp-brand">
        <svg class="jp-brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" fill="currentColor"></rect>
            <path d="M16 6.5c-3.6 0-6.5 2.8-6.5 6.4 0 4.6 6.5 12.6 6.5 12.6s6.5-8 6.5-12.6c0-3.6-2.9-6.4-6.5-6.4zm0 8.7a2.3 2.3 0 1 1 0-4.6 2.3 2.3 0 0 1 0 4.6z" fill="#fff"></path>
        </svg>
        <div id="kc-header-wrapper" class="jp-brand__name">Japan Trip</div>
    </div>

    <main class="jp-card">
        <header class="jp-card__header">

            <h1 id="kc-page-title">        Sign in
</h1>

                <p class="jp-subtitle" id="kc-page-subtitle">        Enter your email to continue with a passkey or a password.
</p>

        </header>

        <div id="kc-content">
            <div id="kc-content-wrapper">


        <div id="kc-form">
            <div id="kc-form-wrapper">
                    <form id="kc-form-login" class="jp-form" data-jp-once="" action="/realms/japan-trip/login-actions/authenticate?session_code=x&amp;execution=x&amp;client_id=japan-trip-frontend&amp;tab_id=x&amp;client_data=x" method="post">
                            <div class="jp-field">
                                <label for="username" class="jp-label">Email</label>
                                <input tabindex="1" id="username" class="jp-input" name="username" value="" type="text" autofocus="" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" aria-invalid="false">
                            </div>


                        <div id="kc-form-buttons" class="jp-field">
                            <button tabindex="4" class="jp-btn jp-btn--primary jp-btn--block " name="login" id="kc-login" type="submit">Sign in</button>
                        </div>
                    </form>
            </div>
        </div>



                    <div id="kc-info" class="">
                        <div id="kc-info-wrapper" class="">
            <p id="kc-registration">New here? <a tabindex="6" href="/realms/japan-trip/login-actions/registration?client_id=japan-trip-frontend&amp;tab_id=x&amp;client_data=x">Create account</a></p>
                        </div>
                    </div>
            </div>
        </div>
    </main>

  <footer class="jp-foot">
    <a class="jp-idp-exit" href="http://localhost:5173/PruebaMapJapan/">Back to Japan Trip</a>
  </footer>
</div>


</body></html>
