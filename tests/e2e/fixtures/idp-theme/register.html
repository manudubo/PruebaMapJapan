<!DOCTYPE html><html class="jp-html" lang="en"><head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

            <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sign in to Japan Trip</title>
    <link rel="icon" href="/resources/login/japan-trip/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
            <link href="/resources/login/japan-trip/css/login.css?v=snapshot" rel="stylesheet">
            
    
    
    
    
    
        
</head>

<body class="jp-body" data-page-id="login-register" data-realm="japan-trip">
<div class="jp-page">
    <div id="kc-header" class="jp-brand">
        <svg class="jp-brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" fill="currentColor"></rect>
            <path d="M16 6.5c-3.6 0-6.5 2.8-6.5 6.4 0 4.6 6.5 12.6 6.5 12.6s6.5-8 6.5-12.6c0-3.6-2.9-6.4-6.5-6.4zm0 8.7a2.3 2.3 0 1 1 0-4.6 2.3 2.3 0 0 1 0 4.6z" fill="#fff"></path>
        </svg>
        <div id="kc-header-wrapper" class="jp-brand__name">Japan Trip</div>
    </div>

    <main class="jp-card">
        <header class="jp-card__header">

            <h1 id="kc-page-title">            Create your account
</h1>


        </header>

        <div id="kc-content">
            <div id="kc-content-wrapper">

                    <p class="jp-required-note"><span aria-hidden="true">*</span> Required fields</p>

        <form id="kc-register-form" class="jp-form" action="/realms/japan-trip/login-actions/registration?session_code=x&amp;execution=x&amp;client_id=japan-trip-frontend&amp;tab_id=x&amp;client_data=x" method="post">

	



			<div class="jp-field">
				<div class="jp-label-row">
					<label for="email" class="jp-label">Email</label>
					<span class="required">*</span>
				</div>
				<div class="">
	<input type="text" id="email" name="email" value="" class="jp-input" aria-invalid="" autocomplete="email">
				</div>
			</div>




			<div class="jp-field">
				<div class="jp-label-row">
					<label for="firstName" class="jp-label">First name</label>
					
				</div>
				<div class="">
	<input type="text" id="firstName" name="firstName" value="" class="jp-input" aria-invalid="">
				</div>
			</div>




			<div class="jp-field">
				<div class="jp-label-row">
					<label for="lastName" class="jp-label">Last name</label>
					
				</div>
				<div class="">
	<input type="text" id="lastName" name="lastName" value="" class="jp-input" aria-invalid="">
				</div>
			</div>





            <div class="jp-field">
                <div id="kc-form-options" class="jp-form__options">
                    <div class="">
                        <span><a href="/auth/realms/japan-trip/login-actions/authenticate?client_id=japan-trip-frontend&amp;tab_id=x&amp;client_data=x">Back to sign in</a></span>
                    </div>
                </div>

                    <div id="kc-form-buttons" class="jp-form__buttons">
                        <input class="jp-btn jp-btn--primary jp-btn--block " type="submit" value="Create account">
                    </div>
            </div>
        </form>
        



            </div>
        </div>
    </main>

  <footer class="jp-foot">
    <a class="jp-idp-exit" href="http://localhost:5173/PruebaMapJapan/">Back to Japan Trip</a>
  </footer>
</div>


</body></html>
