<!DOCTYPE html><html class="jp-html" lang="en"><head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

            <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sign in to Japan Trip</title>
    <link rel="icon" href="/resources/login/japan-trip/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
            <link href="/resources/login/japan-trip/css/login.css?v=snapshot" rel="stylesheet">
            
    
    
    
    
    
        
</head>

<body class="jp-body" data-page-id="login-login-password" data-realm="japan-trip">
<div class="jp-page">
    <div id="kc-header" class="jp-brand">
        <svg class="jp-brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" fill="currentColor"></rect>
            <path d="M16 6.5c-3.6 0-6.5 2.8-6.5 6.4 0 4.6 6.5 12.6 6.5 12.6s6.5-8 6.5-12.6c0-3.6-2.9-6.4-6.5-6.4zm0 8.7a2.3 2.3 0 1 1 0-4.6 2.3 2.3 0 0 1 0 4.6z" fill="#fff"></path>
        </svg>
        <div id="kc-header-wrapper" class="jp-brand__name">Japan Trip</div>
    </div>

    <main class="jp-card">
        <header class="jp-card__header">

            <h1 id="kc-page-title">        Enter your password
</h1>


                <div id="kc-username" class="jp-user">
                    <span id="kc-attempted-username" class="jp-user__name">traveler@example.test</span>
                    <a id="reset-login" class="jp-user__change" href="/auth/realms/japan-trip/login-actions/restart?client_id=japan-trip-frontend&amp;tab_id=x&amp;client_data=x&amp;skip_logout=false">Not you?</a>
                </div>
        </header>

        <div id="kc-content">
            <div id="kc-content-wrapper">


        <div id="kc-form">
            <div id="kc-form-wrapper">
                <form id="kc-form-login" class="jp-form" data-jp-once="" action="/realms/japan-trip/login-actions/authenticate?session_code=x&amp;execution=x&amp;client_id=japan-trip-frontend&amp;tab_id=x&amp;client_data=x" method="post">
                    <div class="jp-field">
                        <label for="password" class="jp-label">Password</label>
                        <div class="jp-input-group" dir="ltr">
                            <input tabindex="2" id="password" class="jp-input" name="password" type="password" autocomplete="current-password" autofocus="" aria-invalid="true" aria-describedby="input-error-password">
                            <button class="jp-input-group__toggle" type="button" aria-label="Show password" aria-controls="password" data-password-toggle="" data-icon-show="jp-icon jp-icon--eye" data-icon-hide="jp-icon jp-icon--eye-off" data-label-show="Show password" data-label-hide="Hide password">
                                <i class="jp-icon jp-icon--eye" aria-hidden="true"></i>
                            </button>
                        </div>
                            <span id="input-error-password" class="jp-field__error kc-feedback-text" aria-live="polite">
                                Invalid username or password.
                            </span>
                    </div>

                        <p class="jp-form__aside"><a tabindex="5" href="/auth/realms/japan-trip/login-actions/reset-credentials?client_id=japan-trip-frontend&amp;tab_id=x&amp;client_data=x">Forgot your password?</a></p>

                    <div id="kc-form-buttons" class="jp-field">
                        <button tabindex="4" class="jp-btn jp-btn--primary jp-btn--block " name="login" id="kc-login" type="submit">Sign in</button>
                    </div>
                </form>
            </div>
        </div>
        



            </div>
        </div>
    </main>

  <footer class="jp-foot">
    <a class="jp-idp-exit" href="http://localhost:5173/PruebaMapJapan/">Back to Japan Trip</a>
  </footer>
</div>


</body></html>
