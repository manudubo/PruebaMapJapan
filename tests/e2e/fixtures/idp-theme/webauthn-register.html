<!DOCTYPE html><html class="jp-html" lang="en"><head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

            <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sign in to Japan Trip</title>
    <link rel="icon" href="/resources/login/japan-trip/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
            <link href="/resources/login/japan-trip/css/login.css" rel="stylesheet">
            
    
    
    
    
    
</head>

<body class="jp-body" data-page-id="login-webauthn-register" data-realm="japan-trip">
<div class="jp-page">
    <div id="kc-header" class="jp-brand">
        <svg class="jp-brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" fill="currentColor"></rect>
            <path d="M16 6.5c-3.6 0-6.5 2.8-6.5 6.4 0 4.6 6.5 12.6 6.5 12.6s6.5-8 6.5-12.6c0-3.6-2.9-6.4-6.5-6.4zm0 8.7a2.3 2.3 0 1 1 0-4.6 2.3 2.3 0 0 1 0 4.6z" fill="#fff"></path>
        </svg>
        <div id="kc-header-wrapper" class="jp-brand__name">Japan Trip</div>
    </div>

    <main class="jp-card">
        <header class="jp-card__header">

            <h1 id="kc-page-title">        Create a passkey
</h1>

                <p class="jp-subtitle" id="kc-page-subtitle">        Sign in with your fingerprint, face or screen lock. No password to remember.
</p>

        </header>

        <div id="kc-content">
            <div id="kc-content-wrapper">


        <div class="jp-passkey-hero" aria-hidden="true"><span class="jp-icon jp-icon--key"></span></div>

        <form id="register" class="jp-form" action="/realms/japan-trip/login-actions/required-action?session_code=x&amp;execution=x&amp;client_id=japan-trip-frontend&amp;tab_id=x&amp;client_data=x" method="post" data-label-joiner="on" data-label-fallback="Passkey">
            <input type="hidden" id="clientDataJSON" name="clientDataJSON">
            <input type="hidden" id="attestationObject" name="attestationObject">
            <input type="hidden" id="publicKeyCredentialId" name="publicKeyCredentialId">
            <input type="hidden" id="authenticatorLabel" name="authenticatorLabel">
            <input type="hidden" id="transports" name="transports">
            <input type="hidden" id="error" name="error">
    <div id="kc-form-options" class="jp-form__options">
        <div class="">
            <div class="checkbox">
                <label>
                    <input type="checkbox" id="logout-sessions" name="logout-sessions" value="on">
                    Sign out from other devices
                </label>
            </div>
        </div>
    </div>
        </form>

        

        <input type="submit" class="jp-btn jp-btn--primary jp-btn--block " id="registerWebAuthn" value="Register passkey">




            </div>
        </div>
    </main>

  <footer class="jp-foot">
      <p id="jp-passkey-recovery" class="jp-passkey-recovery">
        <a id="jp-passkey-recovery-link" href="http://localhost:5173/PruebaMapJapan/recover.html">Can't use a passkey on this device? Get a code by email</a>
      </p>
    <a class="jp-idp-exit" href="http://localhost:5173/PruebaMapJapan/">Back to Japan Trip</a>
  </footer>
</div>


</body></html>
