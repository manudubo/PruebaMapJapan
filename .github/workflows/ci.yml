name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository (review N2).
permissions:
  contents: read

jobs:
  # Review S5: terraform/keycloak/import.sh failure paths, against stub curl/terraform.
  # shellcheck is preinstalled on ubuntu-latest runners.
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck terraform/keycloak/import.sh terraform/keycloak/tests/import.test.sh
      - run: bash terraform/keycloak/tests/import.test.sh
      # Self-hosting kit (docs/SELF-HOSTING.md): lint, then unit tests with a
      # stub tailscale, `docker compose config` per mode and Caddyfile parsing.
      - run: shellcheck -x deploy/selfhost/scripts/*.sh deploy/selfhost/scripts/lib/*.sh deploy/selfhost/tests/*.sh deploy/selfhost/postgres/init/*.sh
      - run: bash deploy/selfhost/tests/scripts.test.sh
        env:
          CADDY_VALIDATE: '1'

  typecheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --workspace=frontend
      - run: npm run typecheck --workspace=frontend

  typecheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --workspace=backend
      - run: npx tsc --noEmit
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --workspace=frontend
      - run: npm run test:run --workspace=frontend

  test-backend:
    runs-on: ubuntu-latest
    # ARCH-06: real Postgres for the backend suite. The suite's globalSetup
    # creates a throwaway database on this server, applies all migrations,
    # and drops it afterwards.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --workspace=backend
      - run: npm run test --workspace=backend

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --workspace=backend
      - run: npm run build --workspace=backend

  e2e:
    runs-on: ubuntu-latest
    needs: [typecheck-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm ci
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      # The preview server is started by Playwright's `webServer` (tests/playwright.config.ts).
      - name: Build frontend
        run: npm run build:frontend
        env:
          # Must include /api: client.ts appends paths like /trips to it, and the specs mock **/api/**.
          VITE_API_URL: http://localhost:8787/api
          VITE_KEYCLOAK_URL: http://localhost:8080
          VITE_KEYCLOAK_REALM: japan-trip
          VITE_KEYCLOAK_CLIENT_ID: japan-trip-frontend
      - name: Run E2E tests (chromium only)
        run: npx playwright test --project=chromium
        working-directory: tests
        env:
          SKIP_REAL_AUTH: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
