name: Keycloak flow

# Review S3: run the KC-01 regression tests (tests/e2e/idp-flow.spec.ts) against a real
# Keycloak 26.6.1 configured by terraform/keycloak, so a change to flows.tf that
# reopens the username-only login bypass fails in CI, not only on a laptop.
#
# Informational: this is a separate workflow and the deploy workflows only follow
# "CI" (workflow_run), so a red run here never blocks a deploy. Make it a required
# check once it has a record of green runs on Actions (see .planning/qa/E2E-DEBT-KC-CI.md).
#
# Also runs the registration flow end to end: scripts/ci/registration-stack.sh starts Postgres 16,
# the migrated backend (REQUIRE_VERIFIED_EMAIL=true, Mailpit as SMTP sink, travelmap-recovery) and
# the built frontend (vite preview on :5173), and CI_BACKEND=1 turns the backend-dependent specs
# from "fixme" into required.
#
# Needs no repository secrets: the Keycloak admin password, the test-user passwords, the worker
# and recovery client secrets, the Postgres password and the OTP secret are generated per run by
# scripts/ci/keycloak-flow.sh / registration-stack.sh and only ever written to mode-600 files
# under $RUNNER_TEMP.

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  idp-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install Terraform
        env:
          TF_VERSION: 1.9.8
          TF_SHA256: 186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8
        run: |
          zip="$RUNNER_TEMP/terraform.zip"
          curl -fsSL -o "$zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  ${zip}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -o -q "$zip" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/terraform" version

      - run: npm ci
        working-directory: tests
      # Workspaces (backend + frontend) for the registration stack.
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
        working-directory: tests

      # Offline: every production / sign-up misconfiguration must fail the plan
      # (terraform/keycloak/tests/guards.tftest.hcl, mocked provider, no Keycloak).
      - name: Terraform plan guards (terraform test)
        env:
          TF_DATA_DIR: ${{ runner.temp }}/tf-guards
        run: |
          terraform -chdir=terraform/keycloak init -input=false -lockfile=readonly -no-color > /dev/null
          terraform -chdir=terraform/keycloak test -no-color

      - name: Start Keycloak 26.6.1 and Mailpit
        run: scripts/ci/keycloak-flow.sh start
      - name: Apply terraform/keycloak (throwaway secrets)
        run: scripts/ci/keycloak-flow.sh apply

      - name: Start Postgres, the backend and the built frontend
        run: scripts/ci/registration-stack.sh start

      - name: Run KC-01 / registration tests (chromium + firefox)
        working-directory: tests
        env:
          # Fail (not fixme) when Keycloak, the backend or their credentials are missing.
          CI_KEYCLOAK: '1'
          CI_BACKEND: '1'
          # No Playwright-owned app: the stack above serves the frontend on :5173.
          SKIP_REAL_AUTH: 'true'
          PW_NO_WEBSERVER: '1'
        run: |
          set -a
          . "$RUNNER_TEMP/keycloak-flow/e2e.env"
          set +a
          npx playwright test e2e/idp-flow.spec.ts e2e/idp-config.spec.ts e2e/idp-hardening.spec.ts \
            e2e/idp-registration.spec.ts \
            --project=chromium --project=firefox --retries=0 --workers=1

      # After the other recovery specs: it exhausts the backend's per-IP recovery limit on purpose.
      - name: Run registration through the built frontend (chromium)
        working-directory: tests
        env:
          CI_KEYCLOAK: '1'
          CI_BACKEND: '1'
          E2E_RATE_LIMIT: '1'
          SKIP_REAL_AUTH: 'true'
          PW_NO_WEBSERVER: '1'
        run: |
          set -a
          . "$RUNNER_TEMP/keycloak-flow/e2e.env"
          set +a
          npx playwright test e2e/registration-integration.spec.ts --project=chromium --retries=0 --workers=1

      - name: Keycloak and backend logs (on failure)
        if: failure()
        run: |
          docker logs --tail 200 kc-flow
          # The backend log holds request ids and event names only (log-hygiene tests): no codes,
          # passwords, tokens or addresses.
          tail -n 200 "$RUNNER_TEMP/keycloak-flow/backend.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: keycloak-flow-playwright-report
          path: tests/playwright-report/
          retention-days: 7
      - name: Stop the registration stack
        if: always()
        run: scripts/ci/registration-stack.sh stop
      - name: Remove Keycloak and generated secrets
        if: always()
        run: scripts/ci/keycloak-flow.sh stop
