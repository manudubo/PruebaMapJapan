name: Security & Accessibility Scans

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Free CLI instead of gitleaks-action (which needs a licence for orgs).
      # Pinned version and SHA-256 (from the release's checksums.txt) so a
      # replaced release asset cannot run in CI (review N2).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan full history (honours .gitleaksignore)
        run: ./gitleaks detect --source . --redact --no-banner --verbose

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm i --no-save axe-core@4.12.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace=frontend
        env:
          VITE_API_URL: http://localhost:8787
          VITE_KEYCLOAK_URL: http://localhost:8080
          VITE_KEYCLOAK_REALM: japan-trip
          VITE_KEYCLOAK_CLIENT_ID: japan-trip-frontend
      - name: Serve production build
        run: |
          npm run preview --workspace=frontend -- --port 4173 &
          npx --yes wait-on@8.0.5 http://localhost:4173/PruebaMapJapan/index.html
      - name: axe-core scan (fails on serious/critical, light + dark)
        run: node scripts/a11y-axe.mjs
      # Lighthouse: accessibility must stay >= 0.95; performance is reported, not gated (A11Y-05)
      - name: Lighthouse
        run: |
          npx --yes @lhci/cli@0.14.0 autorun \
            --collect.url=http://localhost:4173/PruebaMapJapan/index.html \
            --collect.url=http://localhost:4173/PruebaMapJapan/tokyo.html \
            --collect.numberOfRuns=1 \
            --assert.assertions.categories:accessibility="error;minScore=0.95" \
            --upload.target=temporary-public-storage
